<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【管理】情報の編集修正</title> 
    <style>
        /* 背景 */
        body {
            background-color: #FFFDF9 !important; 
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            min-height: 100vh;
            margin: 0;
        }
        /* 画面中央に配置するラッパー */
        .wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        /* 外側の枠（管理者共通：オレンジの斜めストライプ） */
        .outer-box {
            width: 100%;
            max-width: 680px; 
            background-color: #ffffff;
            background-image: linear-gradient(
                -45deg, 
                rgba(255, 152, 0, 0.15) 25%, 
                transparent 25%, 
                transparent 50%, 
                rgba(255, 152, 0, 0.15) 50%, 
                rgba(255, 152, 0, 0.15) 75%, 
                transparent 75%, 
                transparent
            );
            background-size: 40px 40px; 
            border: 3px solid #FFB74D; 
            border-radius: 24px; 
            padding: 40px;
            box-shadow: 0 12px 35px rgba(255, 152, 0, 0.1);
            box-sizing: border-box;
        }
        /* 内側の白いフォームカード */
        .form-card {
            background-color: #ffffff;
            border: 1px solid #FFE0B2; 
            border-radius: 16px; 
            padding: 45px 35px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        /* メインタイトル */
        .inner-title {
            font-size: 2rem !important;
            font-weight: bold;
            text-align: center;
            color: #333333;
            margin-bottom: 25px;
            margin-top: 0;
            letter-spacing: 0.05em;
            width: 100%;
            line-height: 1.3;
        }
        /* フォーム自体の配置設定 */
        .submission-form {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        /* 各入力パーツを包む箱 */
        .form-group {
            width: 100%;
            margin-bottom: 24px;
            box-sizing: border-box;
        }
        /* フォームのラベル */
        .form-label-top {
            display: block;
            font-size: 1.15rem !important;
            font-weight: bold;
            color: #444444;
            margin-bottom: 10px; 
            text-align: left; 
            padding-left: 4px; 
        }
        /* 入力フォーム共通 */
        .form-control-custom {
            border: 2px solid #CBDCDA !important;
            border-radius: 12px !important; 
            padding: 1rem 1.2rem !important;
            font-size: 1.15rem !important;
            text-align: left; 
            transition: all 0.2s ease;
            width: 100% !important; 
            display: block !important;
            box-sizing: border-box;
            background-color: #ffffff;
            color: #333333;
        }
        /* フォーカス時の色（オレンジ） */
        .form-control-custom:focus {
            border-color: #FF9800 !important; 
            box-shadow: 0 0 0 5px rgba(255, 152, 0, 0.2) !important;
            outline: none;
        }
		 /* テキストエリア専用 */
		        textarea.form-control-custom {
		            resize: vertical;
		            min-height: 140px;
		            line-height: 1.5;
		        }
		        /* 保管中メディアのプレビュー表示エリア */
		        .media-preview-box {
		            width: 100%;
		            background-color: #FFFDF9;
		            border: 1px dashed #FFB74D;
		            border-radius: 12px;
		            padding: 15px;
		            text-align: center;
		            box-sizing: border-box;
		            margin-bottom: 24px;
		        }
		        .media-preview-title {
		            display: block;
		            font-size: 0.85rem;
		            color: #777777;
		            margin-bottom: 8px;
		            font-weight: bold;
		        }
		        .media-responsive {
		            max-width: 100%;
		            max-height: 120px;
		            border-radius: 8px;
		            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
		        }
		        /* ファイル選択パーツ専用 */
		        .file-input-custom {
		            padding: 0.8rem 1rem !important;
		            font-size: 1rem !important;
		            background-color: #FFFDF9;
		            cursor: pointer;
		        }
		        /* ✨ 更新ボタン（管理者用立体オレンジ） ✨ */
		        .custom-submit-btn {
		            width: 100% !important; 
		            display: flex !important; 
		            align-items: center;
		            justify-content: center;
		            gap: 12px; 
		            box-sizing: border-box !important;
		            text-decoration: none !important;
		            border-left: none !important;
		            border-right: none !important;
		            background: linear-gradient(180deg, #FFA726 0%, #FB8C00 40%, #EF6C00 100%) !important; 
		            border-top: 1px solid #FFCC80 !important;
		            border-bottom: 5px solid #B35400 !important; 
		            box-shadow: 0 8px 20px rgba(239, 108, 0, 0.3) !important;     
		            border-radius: 16px !important; 
		            padding: 1.2rem 0 !important;       
		            font-size: 1.35rem !important;
		            font-weight: bold;
		            color: #ffffff !important;
		            text-align: center; 
		            cursor: pointer;
		            transition: all 0.1s ease !important;
		            margin: 0 !important;
		            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.25);
		        }
		        .custom-submit-btn:hover {
		            background: linear-gradient(180deg, #FFB74D 0%, #FFA000 40%, #E65100 100%) !important;
		            box-shadow: 0 10px 25px rgba(239, 108, 0, 0.4) !important;
		        }
		        .custom-submit-btn:active {
		            border-bottom: 2px solid #B35400 !important;
		            transform: translateY(3px); 
		            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15) !important;
		        }
		        /* アイコンのスタイル */
		        .submit-icon {
		            width: 24px;
		            height: 24px;
		            fill: none;
		            stroke: #ffffff; 
		            stroke-width: 2.5; 
		            stroke-linecap: round;
		            stroke-linejoin: round;
		            display: inline-block;
		            vertical-align: middle;
		            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.2));
		        }

		        /* ----------------------------------
		         * ✨ 画像のデザインを再現した「リストに戻る」ボタン ✨
		         * ---------------------------------- */
		        .back-link-container {
		            width: 100%;
		            max-width: 480px; 
		            text-align: center;
		            margin-top: 20px; 
		            box-sizing: border-box;
		        }
		        .btn-return-list {
		            display: flex !important;
		            align-items: center;
		            justify-content: center;
		            width: 100%;
		            padding: 1.1rem 0 !important; 
		            box-sizing: border-box !important;
		            text-decoration: none !important;
		            background-color: #ffffff !important;
		            border: 2px solid #FFB74D !important; 
		            border-radius: 16px !important; 
		            font-size: 1.25rem !important;
		            font-weight: bold;
		            cursor: pointer;
		            transition: all 0.2s ease !important;
		        }
		        .btn-return-list .calendar-icon {
		            font-size: 1.35rem;
		            margin-right: 10px; 
		            display: inline-flex;
		            align-items: center;
		        }
		        .btn-return-list .gradient-text {
		            background: linear-gradient(to right, #FF7043 0%, #FFA726 100%) !important;
		            -webkit-background-clip: text !important;
		            -webkit-text-fill-color: transparent !important;
		            background-clip: text !important;
		            text-fill-color: transparent !important;
		            display: inline-block;
		        }
		        .btn-return-list:hover {
		            background-color: #FFFDF9 !important;
		            border-color: #FFA000 !important;
		            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.1);
		        }
		        .btn-return-list:active {
		            transform: scale(0.99);
		            box-shadow: none;
		        }

		        /* 📱 レスポンシブ対応 */
		        @media (max-width: 576px) {
		            .wrapper { padding: 40px 20px; }
		            .outer-box { padding: 40px; border-radius: 24px; }
		            .form-card { padding: 35px 20px; border-radius: 16px; }
		            .inner-title { font-size: 1.4rem !important; margin-bottom: 20px; }
		            .form-label-top { font-size: 1.05rem !important; margin-bottom: 6px; }
		            .form-control-custom { padding: 0.8rem 1rem !important; font-size: 16px !important; border-radius: 10px !important; }
		            .file-input-custom { font-size: 0.95rem !important; padding: 0.7rem 0.9rem !important; }
		            .media-preview-box { padding: 12px; margin-bottom: 20px; }
		            .media-responsive { max-height: 100px; }
		            .custom-submit-btn { font-size: 1.15rem !important; padding: 1rem 0 !important; border-radius: 14px !important; }
		            .submit-icon { width: 20px; height: 20px; stroke-width: 2.2; }
		            .back-link-container { margin-top: 16px; }
		            .btn-return-list { font-size: 1.1rem !important; padding: 0.9rem 0 !important; border-radius: 14px !important; }
		            .btn-return-list .calendar-icon { font-size: 1.2rem; margin-right: 8px; }
		        }
		    </style>
		</head>
		<body>
		<div class="wrapper">
		    <div class="outer-box">   
		        <div class="form-card">  
		            <h1 class="inner-title">✏️ 登録情報の修正・編集</h1>
		            
		            <form th:action="@{/admin/edit/submit}" th:object="${enforcement}" method="post" enctype="multipart/form-data" class="submission-form">  
		                
		                <!-- IDをhiddenで送信（これがないとコントローラーでレコードが特定できず500エラー） -->
		                <input type="hidden" th:field="*{id}">

		                <div class="form-group">
		                    <label class="form-label-top">👤 元の投稿者名</label>
		                    <input type="text" class="form-control-custom" th:field="*{posterName}" style="background-color: #F5F5F5; color: #777777; cursor: not-allowed;" readonly>
		                </div>

		                <div class="form-group">
		                    <label class="form-label-top">📅 取り締まり日時 / 目撃日時（日付）</label>
		                    <input type="date" name="dateInput" class="form-control-custom" th:value="${dateInput}" required>
		                </div>

		                <div class="form-group">
		                    <label class="form-label-top">⏰ 取り締まり日時 / 目撃日時（時刻）</label>
		                    <input type="time" name="timeInput" class="form-control-custom" th:value="${timeInput}" required>
		                </div>
		                
		                <div class="form-group">
		                    <label class="form-label-top">📍 取り締まり場所</label>
		                    <input type="text" class="form-control-custom" th:field="*{location}" required>
		                </div>
		                
		                <div class="form-group">
		                    <label class="form-label-top">💬 取り締まり内容・詳細（修正）</label>
		                    <textarea class="form-control-custom" th:field="*{description}"></textarea>
		                </div>
		                
		                <div th:if="${enforcement.mediaPath != null}" class="media-preview-box">
		                    <span class="media-preview-title">保管中の添付ファイル：</span>
		                    <img th:if="${enforcement.mediaPath.endsWith('.jpg') || enforcement.mediaPath.endsWith('.png') || enforcement.mediaPath.endsWith('.jpeg') || enforcement.mediaPath.endsWith('.gif')}" 
		                         th:src="${enforcement.mediaPath}" class="media-responsive" alt="プレビュー画像">
		                    <video th:if="${enforcement.mediaPath.endsWith('.mp4') || enforcement.mediaPath.endsWith('.mov') || enforcement.mediaPath.endsWith('.webm')}" 
		                           th:src="${enforcement.mediaPath}" controls class="media-responsive" style="width: 100%;"></video>
		                </div>

		                <div class="form-group">
		                    <label class="form-label-top">🔄 新しいメディアの添付（上書きする場合のみ）</label>
		                    <input type="file" class="form-control-custom file-input-custom" name="mediaFile" accept="image/*,video/*">
		                </div>
		                
		                <button type="submit" class="custom-submit-btn">
		                    <svg class="submit-icon" viewBox="0 0 24 24">
		                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
		                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
		                        <polyline points="7 3 7 8 15 8"></polyline>
		                    </svg>
		                    修正内容を保存して更新
		                </button>
		            </form>
		            
		            <!-- ✨ 追加：画像のデザインを再現した「リストに戻る」ボタン ✨ -->
					<div class="back-link-container">
					               <a th:href="@{/admin/list}" class="btn-return-list">
					                   <span class="gradient-text">リストに戻る</span>
					               </a>
					           </div>

		        </div>
		    </div>
		</div>
		</body>
		</html>
