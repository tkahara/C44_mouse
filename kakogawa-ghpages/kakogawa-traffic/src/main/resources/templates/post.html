<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取り締まり情報の投稿</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 📱 スマホでのiPhone自動ズームバグを防ぐための文字サイズ調整 */
        .form-control {
            font-size: 16px !important;
        }
        /* PCで見るときはもう少し文字が小さくても良い場合の微調整（任意） */
        @media (min-width: 576px) {
            .form-control {
                font-size: 1rem !important;
            }
        }
    </style>
</head>
<body class="bg-light">
<div class="container my-5" style="max-width: 600px;">

    <div class="card shadow">
        <div class="card-header bg-danger text-white fw-bold fs-5 py-3">
            ⚠️ 取り締まり情報の投稿 (ユーザー用)
        </div>
        <div class="card-body p-4">
            
            <form th:action="@{/user/post/submit}" th:object="${enforcement}" method="post" enctype="multipart/form-data">
                
                <div class="mb-3">
                    <label class="form-label fw-bold">👤 投稿者名 <span class="badge bg-secondary fw-normal">任意</span></label>
                    <input type="text" class="form-control" th:field="*{posterName}" placeholder="例: 加古川のドライバー (未入力時は「名無し」)">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">📅 取り締まり日時 / 目撃日時</label>
                    <input type="datetime-local" class="form-control" th:field="*{enforcementDate}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">📍 取り締まり場所</label>
                    <input type="text" class="form-control" th:field="*{location}" placeholder="例: 国道2号線 野口交差点付近" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">💬 取り締まり内容・詳細情報</label>
                    <textarea class="form-control" th:field="*{description}" rows="4" placeholder="詳細な状況を入力してください"></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">📸 画像または動画の添付</label>
                    <input type="file" class="form-control" name="file" accept="image/*,video/*">
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-danger btn-lg fw-bold py-3">投稿を完了する</button>
                    <a href="/" class="btn btn-outline-secondary py-2">TOPに戻る</a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
