<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>日付から探す</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #e8f5e9; }
        .calendar-table th, .calendar-table td { width: 14.28%; text-align: center; vertical-align: middle; height: 80px; }
        .has-info { background-color: #ffc107 !important; font-weight: bold; border-radius: 8px; }
        .has-info a { color: #000; text-decoration: none; display: block; width: 100%; height: 100%; line-height: 60px; }
        .empty-day { background-color: #f8f9fa; }
    </style>
</head>
<body>
<div class="container my-5" style="max-width: 800px;">

    <div class="card shadow p-4 bg-white">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a th:href="@{/user/calendar(year=${prevMonth.year},month=${prevMonth.monthValue})}" class="btn btn-sm btn-outline-primary">&larr; 前の月</a>
            <h2 class="h3 mb-0 text-dark">📅 <span th:text="${currentYear} + '年 ' + ${currentMonth} + '月'">2026年 06月</span></h2>
            <a th:href="@{/user/calendar(year=${nextMonth.year},month=${nextMonth.monthValue})}" class="btn btn-sm btn-outline-primary">次の月 &rarr;</a>
        </div>

        <table class="table table-bordered calendar-table shadow-sm">
            <thead>
                <tr class="table-dark">
                    <th class="text-danger">日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th class="text-info">土</th>
                </tr>
            </thead>
            <tbody>
                <th:block th:each="row : ${#numbers.sequence(0, 5)}">
                    <tr>
                        <th:block th:each="col : ${#numbers.sequence(0, 6)}"
                                  th:with="idx=${row * 7 + col}, day=${idx < calendarDays.size() ? calendarDays[idx] : ''}">
                            <td th:with="dateStr=${day == '' ? '' : currentYear + '-' + (currentMonth < 10 ? '0' + currentMonth : '' + currentMonth) + '-' + (day != '' and T(java.lang.Integer).parseInt(day) < 10 ? '0' + day : day)}"
                                th:class="${day == ''} ? 'empty-day' : (${day != '' and #lists.contains(activeDates, dateStr)} ? 'has-info' : '')">

                                <!-- ① 情報がある日はリンク化 -->
                                <div th:if="${day != '' and #lists.contains(activeDates, dateStr)}">
                                    <a th:href="@{/user/date/{dateStr}(dateStr=${dateStr})}" th:text="${day}">1</a>
                                </div>

                                <!-- ② 情報が無い日は数字のみ（リンクなし） -->
                                <div th:if="${day != '' and !#lists.contains(activeDates, dateStr)}"
                                     th:text="${day}" class="text-dark">1</div>
                            </td>
                        </th:block>
                    </tr>
                </th:block>
            </tbody>
        </table>

        <div class="text-center mt-4">
            <a href="/" class="btn btn-secondary">トップへ戻る</a>
            <a th:href="@{/user/list}" class="btn btn-primary">すべての情報をリスト表示</a>
        </div>
    </div>

</div>
</body>
</html>
