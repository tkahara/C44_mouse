# ===================================================================
# 💻 サーバー基本ポート番号
# ===================================================================
server.port=8081

# ===================================================================
# 🛢️ 【H2から移行】MySQLへの接続プロパティ設定
# ===================================================================
# ローカル環境のMySQL(keg_dbデータベース)へ文字コードUTF-8かつタイムゾーン日本時間で接続
spring.datasource.url=jdbc:mysql://localhost:3306/keg_db?characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=keg_user
spring.datasource.password=keg_pass

# ===================================================================
# 💾 Hibernate JPA オブジェクト・マッピングルール
# ===================================================================
# update: Java側のEnforcementクラスの構成に基づき、MySQLのテーブルにカラムを自動で追加・マージします
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# ===================================================================
# 📸 メディアファイルのサイズ制限と物理保管ディレクトリ定義
# ===================================================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

app.upload.dir=./upload


